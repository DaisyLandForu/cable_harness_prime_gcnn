run_name: bipartite_gcnn_prim_feat_pilot
seed: 0
device: cuda
output_dir: artifacts/models/gcnn_prim_feat
# Formal protocol: Stage A 2400 × 16+0 on real_01/03/05/06/07, then Stage B 600 × 12+4
# with real_02. DualPool 12 medium + 4 real_02 is frozen at 25%. real_04 is excluded.
train_instances:
  - data/instances/transfer/real_01.cip
  - data/instances/transfer/real_03.cip
  - data/instances/transfer/real_05.cip
  - data/instances/train/real_06.cip
  - data/instances/train/real_07.cip
  - data/instances/transfer/real_02.cip
validation_instances:
  - data/instances/validation/real_08.cip
environment:
  seed: 0
  time_limit: 60.0
  node_limit: 100
  gamma: 1.0
  reward_mode: hybrid_node_lp
  bootstrap_on_truncation: true
  cache_static_features: true
model:
  embedding_dim: 64
  hidden_dim: 128
  loss_mode: scalar
  distributional_bins: 18
  z_min: -1.0
  z_max: 12.0
  hl_gauss_sigma: 0.75
optimization:
  # DualPool logical batch is always 16 (12 medium + 4 real_02, or 16 medium).
  total_gradient_steps: 3000
  batch_size: 16
  medium_count_limit: 224
  large_count_limit: 32
  replay_capacity: 256
  min_replay_size: 16
  learning_rate: 0.0003
  updates_per_env_step: 4
  n_step: 3
  gamma: 1.0
  gradient_clip: 10.0
  target_tau: 0.01
  per_alpha: 0.6
  per_beta_start: 0.4
  per_beta_steps: 3000
  per_epsilon: 0.00001
exploration:
  epsilon_start: 1.0
  epsilon_end: 0.05
  decay_steps: 2400
  boltzmann_temperature: 0.0
evaluation:
  seeds: [100]
  interval_steps: 250
  early_stopping_patience: 8
  compare_seeds: [100, 101, 102]
normalization_path: results/probes/shared_normalization.json
normalization_warmup_states: 8
log_interval_steps: 20
stage_a_steps: 2400
stage_b_steps: 600
medium_time_limit: 60.0
medium_node_limit: 100
large_time_limit: 300.0
large_node_limit: 100
