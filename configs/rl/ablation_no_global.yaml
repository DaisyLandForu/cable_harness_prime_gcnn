run_name: gcnn_ablation_no_global_features
seed: 0
device: cuda
output_dir: artifacts/models/ablations/gcnn_no_global
train_instances: [data/instances/train/real_06.cip]
validation_instances: [data/instances/validation/real_08.cip]
environment:
  seed: 0
  time_limit: 60.0
  node_limit: 100
  gamma: 1.0
  reward_mode: negative_node_increment
  bootstrap_on_truncation: false
  cache_static_features: true
model:
  embedding_dim: 64
  hidden_dim: 128
  loss_mode: scalar
  use_global_features: false
optimization:
  total_gradient_steps: 1000
  batch_size: 2
  replay_capacity: 64
  min_replay_size: 8
  learning_rate: 0.0003
  updates_per_env_step: 4
  n_step: 3
  gamma: 1.0
  gradient_clip: 10.0
  target_tau: 0.01
  per_alpha: 0.6
  per_beta_start: 0.4
  per_beta_steps: 1000
  per_epsilon: 0.00001
exploration:
  epsilon_start: 1.0
  epsilon_end: 0.05
  decay_steps: 800
  boltzmann_temperature: 0.1
evaluation:
  seeds: [100]
  interval_steps: 250
  early_stopping_patience: 4
  compare_seeds: [100]
normalization_warmup_states: 4
log_interval_steps: 10
