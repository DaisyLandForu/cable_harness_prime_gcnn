schema_version: 1
strategy_id: steiner-single-long-lived-branch-v1
active_branch: research/steiner-migration
one_active_migration_branch: true
stage_branch_creation_allowed: false
force_push_allowed: false
rebase_published_history_allowed: false
phase_merge_required: false
final_merge_first_allowed_stage: S13

checkpoint_tags:
  local_gate_pattern: steiner-sXX-local-gate-vN
  audited_pattern: steiner-sXX-audited-vN
  annotated_required: true
  published_tag_move_allowed: false
  version_increment_on_remediation: true

audit_identity:
  immutable_fields:
    - base_sha
    - content_head_sha
    - phase_head_sha
    - substantive_commit_range
  moving_branch_name_is_sufficient: false
  pull_request_is_sufficient: false

push_policy:
  local_gate_pass_required: true
  fast_forward_only: true
  remote_ahead_or_diverged_is_blocking: true
  external_write_requires_explicit_authorization: true

legacy_stage_branches:
  policy: retain_read_only_no_new_commits
  branches:
    - research/steiner-s00-contract
    - research/steiner-s01-scaffold
    - research/steiner-s02-formulation

