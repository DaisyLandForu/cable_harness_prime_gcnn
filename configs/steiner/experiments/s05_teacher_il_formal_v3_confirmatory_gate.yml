statistics:
  bootstrap_seed: 20260902
  bootstrap_replicates: 10000
  confidence_level: 0.95
  exact_bootstrap_lineages: 30
  exact_lineages_per_family: 6
  resampling_unit: base_graph_lineage
  state_aggregation_within_lineage: mean
  seed_aggregation_within_lineage: mean
  primary_effect: random_regret_minus_model_regret
  confidence_interval_quantiles: [0.025, 0.975]
  percentile_method: linear
  coefficient_of_variation_definition: sample_std_ddof_1_divided_by_mean
  coefficient_of_variation_zero_mean_rule: pass_only_if_all_five_regrets_are_zero
  supplemental_test: wilcoxon_signed_rank_with_holm

scientific_gate:
  require_all_five_frozen_models_evaluated: true
  require_every_seed_mean_improvement_over_random: true
  require_every_family_aggregate_mean_improvement_over_random: true
  require_primary_bootstrap_ci_lower_bound_above_zero: true
  max_seed_regret_coefficient_of_variation: 0.15
  require_checkpoint_reload_max_abs_error: 0.0
  require_checkpoint_state_dict_bit_exact: true
  require_exact_30_lineage_matrix: true
  prohibit_test_and_final_access: true

execution_order:
  - external_gpt_preexecution_pass_recorded
  - implementation_and_tests_complete
  - collect_all_240_teacher_tasks
  - teacher_quality_and_candidate_eligibility_evaluated
  - select_and_seal_exact_30_lineages_and_320_states
  - pre_model_access_gate_pass
  - evaluate_five_frozen_models
  - aggregate_once_against_frozen_scientific_gate

failure_policy:
  formal_v1_and_v2_failures_remain_immutable: true
  retain_every_v3_candidate_and_task_result: true
  allow_model_or_regret_based_lineage_selection: false
  allow_seed_graph_or_lineage_replacement_after_collection: false
  allow_gate_threshold_relaxation: false
  allow_model_retraining_or_checkpoint_reselection: false
  test_and_final_access_prohibited: true
  s06_authorized: false
  on_v3_failure: retain_and_stop_before_s06
