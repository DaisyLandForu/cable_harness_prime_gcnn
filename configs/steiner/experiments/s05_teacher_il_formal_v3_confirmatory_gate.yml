  allow_unregistered_replacement_candidates: false
  allow_teacher_retry_until_success: false

state_selection:
  selected_states_per_family: 64
  selected_states_total: 320
  method: lineage_round_robin_v3
  within_lineage_order: [state_index, teacher_seed, semantic_sha256]
  lineage_cycle_order: [candidate_rank, graph_sha256]
