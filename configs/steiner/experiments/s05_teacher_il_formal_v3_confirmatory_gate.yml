  deduplication_key: semantic_sha256
  reject_duplicate_semantic_sha256: true
  reject_cross_role_or_split_lineage: true
  if_any_family_has_fewer_than_64_unique_valid_states: fail_v3_before_model_loading

teacher_quality_gate:
