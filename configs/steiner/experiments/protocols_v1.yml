schema_version: 1
protocol_set_id: steiner-protocols-v1
problem: SPG
formulation: rooted_mcf_v1
threads_per_solver: 1

seeds:
  solver_pilot: [0]
  solver_formal: [0, 1, 2, 3, 4]
  training_formal: [101, 202, 303, 404, 505]
  teacher_collection: [1001, 1002, 1003]
  bootstrap: 20260902
  rule: every_failed_or_skipped_seed_remains_in_the_run_manifest

protocols:
  P0:
    id: correctness-v1
    purpose: formulation_mapping_and_solution_correctness
    time_limit_seconds: 60
    node_limit: 10000
    memory_limit_mb: 4096
    solver_seeds: solver_pilot
    solver_stack: generic_scip_8_0_4
    controls:
      detailed_log: true
      presolve: default
      cuts: default
      heuristics: default
      restarts: default
      node_selector: default
  P1:
    id: controlled-branching-v1
    purpose: isolate_branching_policy
    time_limit_seconds: 600
    node_limit: 200000
    memory_limit_mb: 8192
    solver_seeds: solver_formal
    solver_stack: generic_scip_8_0_4
    controls:
      presolving_maxrounds: 0
      separating_maxrounds: 0
      separating_maxroundsroot: 0
      heuristics: "off"
      restart_limit: 0
      node_selector: estimate
      propagation: default
  P2:
    id: generic-scip-v1
    purpose: generic_SCIP_end_to_end_performance
    time_limit_seconds: 600
    node_limit: 200000
    memory_limit_mb: 8192
    solver_seeds: solver_formal
    solver_stack: generic_scip_8_0_4
    controls:
      presolve: scip_default
      cuts: scip_default
      heuristics: scip_default
      restarts: scip_default
      node_selector: scip_default
  P3:
    id: scip-jack-external-v1
    purpose: specialist_solver_end_to_end_reference
    time_limit_seconds: 1800
    node_limit: -1
    memory_limit_mb: 16384
    solver_seeds: solver_formal
    solver_stack: scip_jack_version_pinned_at_integration
    controls:
      reductions: scip_jack_default
      cuts: scip_jack_default
      heuristics: scip_jack_default
      branching: scip_jack_default
  P4:
    id: scip-jack-branching-hard-v1
    purpose: specialist_solver_branching_increment
    time_limit_seconds: 1800
    node_limit: 500000
    memory_limit_mb: 16384
    solver_seeds: solver_formal
    solver_stack: scip_jack_version_pinned_at_integration
    controls:
      hard_subset_selection: frozen_native_baseline_only
      reductions: scip_jack_default
      cuts: scip_jack_default
      heuristics: scip_jack_default
      node_selector: scip_jack_default

planned_parallelism:
  rollout_workers: 6
  maximum_p95_rss_per_worker_mb: 8192
  aggregate_worker_budget_mb: 49152
  reserved_host_headroom_mb: 16384

action_contract:
  S02_through_S09:
    entity_kind: EDGE
    eligible_variables: fractional_binary_stp_x_only
    continuous_flow_variables_eligible: false
    legal_action_source: current_SCIP_LP_branch_candidates
    coverage_required: 1.0
  formal_learned_runs:
    invalid_actions_allowed: 0
    nan_scores_allowed: 0
    mapping_failures_allowed: 0
    unexpected_fallbacks_allowed: 0
    no_legal_candidate_result: SCIP_DIDNOTRUN

baselines:
  primary_solver_reference: relpscost
  production_reference: scip_default
  required:
    - scip_default
    - relpscost
    - random_candidate
    - most_infeasible
    - strong_branching_budgeted_subset
    - B0_milp_gcnn_imitation
    - RL_from_frozen_IL
    - RL_from_scratch_ablation
  conditional:
    - B1_enhanced_milp_gcnn
    - original_graph_only
    - dual_view
    - dual_view_plus_component
    - scip_jack_typed_policy

metrics:
  primary_order:
    - solved_rate_maximize
    - PAR2_minimize
    - primal_dual_integral_minimize
  wall_time_shift_seconds: 1.0
  PAR2_rule: solved_wall_time_else_two_times_protocol_time_limit
  failure_penalty_rule: timeout_node_limit_memory_out_solver_error_and_invalid_policy_all_receive_PAR2_penalty
  final_gap_rule: SCIP_relative_gap_at_budget_with_infinite_or_undefined_reported_separately
  diagnostics:
    - shifted_geometric_mean_nodes
    - lp_iterations
    - time_to_first_incumbent
    - root_gap
    - branching_decisions
    - feature_extraction_seconds
    - inference_seconds
    - callback_seconds
    - invalid_action_count
    - unexpected_fallback_count
    - timeout_count
    - memory_out_count
    - catastrophic_slowdown_rate_over_2x
  teacher:
    - top1_accuracy
    - topk_accuracy
    - normalized_strong_branching_regret
    - rank_correlation

statistics:
  pairing_unit: instance_solver_seed
  training_seed_reporting: report_each_seed_and_aggregate_across_all_seeds
  bootstrap_unit: instance
  bootstrap_replicates: 10000
  confidence_level: 0.95
  bootstrap_seed: 20260902
  interval: paired_percentile_bootstrap
  supplemental_test: paired_wilcoxon_with_holm_correction
  effect_sizes_required: true
  solved_and_unsolved_counts_required: true
  checkpoint_selection:
    split: validation_only
    lexicographic_order:
      - solved_rate_maximize
      - PAR2_minimize
      - primal_dual_integral_minimize
    training_loss_allowed_for_final_selection: false
    final_test_allowed_for_selection: false

S03_branchability_gate:
  instance_fraction_with_at_least_5_legal_decisions_min: 0.60
  nontrivial_instance_legal_decisions_median_min: 10
  strong_branch_valid_state_fraction_min: 0.60
  strong_branch_all_tie_state_fraction_max: 0.40
  tie_tolerance: "abs(a-b) <= 1e-9 * max(1, abs(a), abs(b))"
  action_to_original_edge_mapping_rate_min: 1.0
  p95_worker_rss_mb_max: 8192
  allowed_threshold_revision_count: 1
  revision_condition: measurement_definition_bug_only_before_S03_learned_results

final_test_policy:
  manifest: configs/steiner/splits/final_test_v1.yml
  sealed: true
  allowed_stage_for_first_learned_run: S12_after_checkpoint_and_code_freeze
  rerun_policy: no_tuning;_additional_runs_are_post_hoc

prohibited_comparisons:
  - compare_node_counts_between_generic_MCF_or_SCF_and_SCIP_Jack
  - attribute_P3_solver_difference_to_branching_policy_alone
  - compare_MCF_and_SCF_node_counts_as_policy_quality_without_formulation_factor
  - tune_any_component_on_final_test
  - select_or_drop_instances_using_learned_policy_outcomes
  - report_only_successful_training_or_solver_seeds
  - call_controlled_P1_results_production_performance
  - claim_Steiner_family_generalization_from_SPG_only
