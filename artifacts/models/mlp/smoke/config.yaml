run_name: candidate_mlp_smoke
seed: 0
device: cuda
output_dir: artifacts/models/mlp/smoke
train_instances:
  - data/instances/train/real_06.cip
validation_instances:
  - data/instances/validation/real_08.cip
environment:
  seed: 0
  time_limit: 60.0
  node_limit: 50
  gamma: 1.0
  reward_mode: negative_node_increment
  bootstrap_on_truncation: false
  cache_static_features: true
model:
  hidden_sizes: [128, 128]
optimization:
  total_gradient_steps: 500
  batch_size: 16
  replay_capacity: 2000
  min_replay_size: 16
  learning_rate: 0.0003
  updates_per_env_step: 16
  n_step: 3
  gamma: 1.0
  gradient_clip: 10.0
  target_update_interval: 100
exploration:
  epsilon_start: 1.0
  epsilon_end: 0.1
  decay_steps: 400
evaluation:
  seeds: [100]
  interval_steps: 250
  early_stopping_patience: 4
  compare_seeds: [100]
normalization_warmup_states: 8
log_interval_steps: 25
